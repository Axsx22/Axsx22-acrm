name: ACRM v8.6 CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test ACRM v8.6
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and test dependencies
        run: python -m pip install -e ".[test]"

      - name: Compile source and tests
        run: python -m compileall -q acrm_core tests

      - name: Static lint (changed Runtime surface)
        run: >-
          python -m ruff check
          acrm_core/runtime/failure_taxonomy.py
          acrm_core/runtime/field_runtime.py
          acrm_core/runtime/specialist_governance.py
          tests/unit/test_runtime_v7_v83.py

      - name: Run tests with coverage
        run: python -m pytest --cov=acrm_core --cov-report=term-missing --cov-report=xml -ra

      - name: Audit installed dependencies
        run: python -m pip_audit --strict --skip-editable
