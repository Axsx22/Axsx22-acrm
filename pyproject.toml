[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "acrm-core"
version = "8.6.0"
description = "ACRM v8.6 core runtime components"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "ACRM Project" }
]
dependencies = []

[project.optional-dependencies]
test = [
    "pytest>=9.0.3,<10",
    "pytest-cov>=5,<7",
    "ruff>=0.9,<1",
    "pip-audit>=2.7,<3; python_version >= '3.11'"
]

[tool.setuptools.packages.find]
include = ["acrm_core*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
